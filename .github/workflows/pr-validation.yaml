name: pr-validation-workflow
on:
  pull_request:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install HTMLHint
        run: npm install --save-dev htmlhint
      - name: Lint all HTML files
        run: npx htmlhint "**/*.html"
      - name: Install StyleLint
        run: npm install --save-dev stylehint
      - name: Lint all CSS files
        run: npx stylelint "**/*.css"
      - name: Install Parcel
        run: npm install --save-dev parcel
      - name: Build Job         
        run: npm parcel build "src/index.html" --dist-dir "./dev" "./"
